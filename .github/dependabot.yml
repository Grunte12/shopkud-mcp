version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Bangkok
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Bangkok
    open-pull-requests-limit: 2
    groups:
      node-development-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Bangkok
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
