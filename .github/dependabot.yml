version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Bangkok
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # ShopKud currently uses FastMCP from MCP 1.x. MCP 2.x renamed that API;
      # upgrade it deliberately with a compatibility change, not automatically.
      - dependency-name: mcp
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Bangkok
    open-pull-requests-limit: 2
    groups:
      node-development-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Bangkok
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
