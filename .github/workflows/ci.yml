name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-browser:
    name: Portable Chrome bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
      - name: Install fixture dependencies
        run: |
          python -m pip install '.[dev]'
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify portable setup and MCP startup
        run: python -m unittest tests.test_websocket_bridge tests.test_portable_client
      - name: Exercise actual extension via WebSocket
        shell: bash
        run: SHOPKUD_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')" node tests/websocket-extension.cjs

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tooling
        run: python -m pip install '.[dev]'
      - name: Check release consistency
        run: python scripts/check-release-consistency.py
      - name: Run Python unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run Python workflow evals
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python evals/rank-playbook.py
          python evals/broker-cancellation.py

  browser-native:
    name: Browser and native fixtures
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install Python package
        run: python -m pip install '.[dev]'
      - name: Install locked browser fixtures
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Run complete synthetic fixture suite
        run: SHOPKUD_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')" npm test

  windows-native:
    name: Windows install and native bridge
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install '.[dev]'
      - name: Run Windows installer, storage and TCP native-host checks
        run: >-
          python -m unittest
          tests.test_windows_support
          tests.test_broker.TcpBrokerTests

  package-audit:
    name: Package and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Build source and wheel distributions
        run: |
          python -m pip install 'build>=1.2,<2' 'pip-audit==2.10.1' \
            'skillspector @ git+https://github.com/NVIDIA/skillspector.git@95a52d89fa16f608f0b18ccee76b0918ea4b7eef'
          python -m build
      - name: Audit bundled Agent skill
        run: |
          skillspector scan shopkud_mcp/skills/shopkud-affiliate \
            --no-llm \
            --fail-on-findings \
            --fail-on-incomplete \
            --min-coverage 100
      - name: Verify wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/shopkud-wheel"
          "$RUNNER_TEMP/shopkud-wheel/bin/python" -m pip install \
            'pip==26.2.2' 'setuptools==84.2.1'
          "$RUNNER_TEMP/shopkud-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/shopkud-wheel/bin/shopkud-mcp" --help >/dev/null
          "$RUNNER_TEMP/shopkud-wheel/bin/python" - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          from zipfile import ZipFile
          import glob
          import tomllib
          import shopkud_mcp

          root = Path(shopkud_mcp.__file__).parent
          project = tomllib.loads(Path("pyproject.toml").read_text())
          assert version("shopkud-mcp") == project["project"]["version"]
          assert (root / "workflows/affiliate.json").is_file()
          assert (root / "skills/shopkud-affiliate/SKILL.md").is_file()
          assert (root / "skills/shopkud-affiliate/references/workflow.md").is_file()
          wheel = glob.glob("dist/*.whl")
          assert len(wheel) == 1, wheel
          with ZipFile(wheel[0]) as archive:
              extension = [name for name in archive.namelist() if "/share/shopkud-mcp/extension/" in name]
          expected = project["tool"]["setuptools"]["data-files"]["share/shopkud-mcp/extension"]
          assert {Path(name).name for name in extension} == {Path(name).name for name in expected}
          PY
      - name: Audit Python runtime dependencies
        run: |
          "$RUNNER_TEMP/shopkud-wheel/bin/python" -m pip list --format=freeze \
            | grep -v '^shopkud-mcp==' >"$RUNNER_TEMP/shopkud-runtime-requirements.txt"
          python -m pip_audit --strict --requirement "$RUNNER_TEMP/shopkud-runtime-requirements.txt"
      - name: Audit locked Node development dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
