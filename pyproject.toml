[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shopkud-mcp"
version = "0.11.4"
description = "Agent-neutral MCP tools for an owner's open Shopee Affiliate Chrome page"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "uvicorn>=0.34,<1"]

[project.scripts]
shopkud-mcp = "shopkud_mcp.server:main"

[tool.setuptools.packages.find]
include = ["shopkud_mcp*"]

[tool.setuptools.package-data]
shopkud_mcp = ["workflows/affiliate.json", "skills/shopkud-affiliate/SKILL.md", "skills/shopkud-affiliate/references/workflow.md"]

[tool.setuptools.data-files]
"share/shopkud-mcp/extension" = ["extension/manifest.json", "extension/core.js", "extension/linkcapture.js", "extension/detail.js", "extension/pagination.js", "extension/search.js", "extension/review-data.js", "extension/review.js", "extension/content.js", "extension/background.js", "extension/listing.js", "extension/listing-access.html", "extension/listing-access.js", "extension/sidepanel.html", "extension/sidepanel.css", "extension/sidepanel.js", "extension/dashboard.html", "extension/dashboard.css", "extension/dashboard.js", "extension/subid.js", "extension/verify.js", "extension/surfaces.js", "extension/selectors.js", "extension/diagnose.js"]
