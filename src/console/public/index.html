<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopKud Core Console</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 2em;
      font-weight: 700;
    }

    .status {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .status-badge {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9em;
      font-weight: 600;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
    }

    .status-badge.connected {
      background: #10b981;
    }

    .status-badge.disconnected {
      background: #ef4444;
    }

    .tabs {
      display: flex;
      background: #f3f4f6;
      border-bottom: 2px solid #e5e7eb;
    }

    .tab {
      padding: 15px 30px;
      cursor: pointer;
      font-weight: 600;
      border: none;
      background: transparent;
      transition: all 0.3s;
    }

    .tab.active {
      background: white;
      border-bottom: 3px solid #667eea;
    }

    .tab:hover {
      background: rgba(102, 126, 234, 0.1);
    }

    .content {
      padding: 30px;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #4b5563;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .sub-ids-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1em;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .links-grid {
      display: grid;
      gap: 15px;
      margin-top: 20px;
    }

    .link-card {
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s;
    }

    .link-card:hover {
      border-color: #667eea;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
    }

    .link-card h3 {
      color: #667eea;
      margin-bottom: 10px;
    }

    .link-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      font-size: 0.9em;
      color: #6b7280;
    }

    .link-meta div {
      padding: 8px;
      background: white;
      border-radius: 6px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85em;
      font-weight: 600;
      margin-right: 8px;
    }

    .badge-channel {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge-verified {
      background: #d1fae5;
      color: #065f46;
    }

    .badge-unknown {
      background: #f3f4f6;
      color: #6b7280;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-bar input {
      flex: 1;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .batch-item {
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .batch-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .alert {
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .alert-success {
      background: #d1fae5;
      color: #065f46;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
    }

    .queue-item {
      background: #f9fafb;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .queue-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85em;
      font-weight: 600;
    }

    .queue-status.pending { background: #fef3c7; color: #92400e; }
    .queue-status.running { background: #dbeafe; color: #1e40af; }
    .queue-status.completed { background: #d1fae5; color: #065f46; }
    .queue-status.failed { background: #fee2e2; color: #991b1b; }
    .queue-status.captcha_stopped { background: #fecaca; color: #7f1d1d; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🛍️ ShopKud Core Console</h1>
      <div class="status">
        <div class="status-badge disconnected" id="chrome-status">Chrome: Disconnected</div>
        <button onclick="refreshStatus()">🔄 Refresh</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('links')">Links Registry</button>
      <button class="tab" onclick="switchTab('create')">Create Link</button>
      <button class="tab" onclick="switchTab('batch')">Batch Create</button>
      <button class="tab" onclick="switchTab('offers')">Offers</button>
      <button class="tab" onclick="switchTab('queue')">Job Queue</button>
      <button class="tab" onclick="switchTab('status')">System Status</button>
    </div>

    <div class="content">
      <div id="links-panel" class="panel active">
        <h2>Links Registry</h2>
        <div class="search-bar">
          <input type="text" id="search-product" placeholder="Product ID">
          <select id="search-channel">
            <option value="">All Channels</option>
            <option value="tiktok">TikTok</option>
            <option value="ig">Instagram</option>
            <option value="fb">Facebook</option>
            <option value="x">X (Twitter)</option>
            <option value="yt">YouTube</option>
            <option value="spv">Shopee Video</option>
          </select>
          <input type="text" id="search-clip" placeholder="Clip ID">
          <button onclick="searchLinks()">Search</button>
        </div>
        <div id="links-container" class="links-grid"></div>
      </div>

      <div id="create-panel" class="panel">
        <h2>Create Affiliate Link</h2>
        <div id="create-result"></div>
        <div class="form-group">
          <label>Product URL</label>
          <input type="url" id="product-url" placeholder="https://shopee.co.th/product-i.123.456">
        </div>
        <div class="form-group">
          <label>Channel</label>
          <select id="channel">
            <option value="tiktok">TikTok</option>
            <option value="ig">Instagram</option>
            <option value="fb">Facebook</option>
            <option value="x">X (Twitter)</option>
            <option value="yt">YouTube</option>
            <option value="spv">Shopee Video</option>
          </select>
        </div>
        <div class="form-group">
          <label>Clip ID (Optional)</label>
          <input type="text" id="clip-id" placeholder="v6">
        </div>
        <div class="form-group">
          <label>Sub IDs (convention: platform, product, clip, variant, date)</label>
          <div class="sub-ids-grid">
            <div>
              <label>Sub ID 1</label>
              <input type="text" id="sub-id-1" placeholder="tiktok">
            </div>
            <div>
              <label>Sub ID 2</label>
              <input type="text" id="sub-id-2" placeholder="P1">
            </div>
            <div>
              <label>Sub ID 3</label>
              <input type="text" id="sub-id-3" placeholder="v6">
            </div>
            <div>
              <label>Sub ID 4</label>
              <input type="text" id="sub-id-4" placeholder="a">
            </div>
            <div>
              <label>Sub ID 5</label>
              <input type="text" id="sub-id-5" placeholder="202610">
            </div>
          </div>
        </div>
        <button onclick="createLink()">Create Link</button>
      </div>

      <div id="batch-panel" class="panel">
        <h2>Batch Create Links</h2>
        <div id="batch-result"></div>
        <div id="batch-items"></div>
        <div class="batch-actions">
          <button onclick="addBatchItem()">+ Add Item</button>
          <button onclick="createBatch()">Create All</button>
        </div>
      </div>

      <div id="offers-panel" class="panel">
        <h2>Product Offers & Commissions</h2>
        <p style="color: #6b7280; margin-bottom: 20px;">View commission rates and product offers. Placeholder for missions coming soon.</p>
        <div class="form-group">
          <label>Item ID</label>
          <input type="text" id="offer-item-id" placeholder="123456789">
          <button onclick="getOffer()" style="margin-top: 10px;">Get Offer</button>
        </div>
        <div id="offer-result"></div>
      </div>

      <div id="queue-panel" class="panel">
        <h2>Job Queue & Status</h2>
        <button onclick="loadQueue()" style="margin-bottom: 20px;">Refresh Queue</button>
        <div id="queue-container"></div>
      </div>

      <div id="status-panel" class="panel">
        <h2>System Status</h2>
        <div id="status-detail"></div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
