<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ShopKud Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ea580c'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">ข้ามไปเนื้อหา</a>
  <div class="shell">
    <aside class="side" aria-label="เมนูหลัก">
      <div class="brand">
        <span class="brand-mark">K</span>
        <div><strong>ShopKud</strong><small>Console · เครื่องนี้เท่านั้น</small></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="body">
      <header class="topbar">
        <div id="conn-pill" class="conn-pill" data-state="unknown"><span class="dot dot-idle"></span><span id="conn-text">กำลังตรวจ Chrome...</span></div>
        <div class="topbar-right">
          <span class="muted" id="asof"></span>
          <span class="badge badge-ok" title="API ใช้ได้เฉพาะ localhost"><span class="dot dot-ok"></span>localhost</span>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
